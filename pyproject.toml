[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "awshealth"
version = "0.1.0"
description = "Read-only AWS health audit: deadlines in dollars, forgotten resources, silent failures and security gaps, with an AI layer that never holds your credentials."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Brian Pravato" }]
keywords = ["aws", "audit", "finops", "security", "claude-code", "agent-skills"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "boto3>=1.34",
  "jmespath>=1.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
awshealth = "awshealth.cli:main"

[project.urls]
Homepage = "https://github.com/kbrianps/claude-aws-health"
Issues = "https://github.com/kbrianps/claude-aws-health/issues"

[tool.hatch.build.targets.wheel]
packages = ["awshealth"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
